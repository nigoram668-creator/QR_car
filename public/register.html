<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Car — Ro‘yxatdan o‘tish</title>

<style>
body {
    font-family: Arial;
    background: #f2f4f7;
    padding: 20px;
}

.box {
    max-width: 450px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #ccc;
}

input, textarea, button {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    background: #111;
    color: white;
    border: none;
    font-weight: bold;
}

#message {
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="box">

<h2>🚗 QR Car</h2>
<h3>Ro‘yxatdan o‘tish</h3>

<input id="qr_id" placeholder="QR ID: QRCAR0001">

<input id="name" placeholder="F.I.Sh.">

<input id="phone" placeholder="Telefon raqami">

<input id="car_number" placeholder="Davlat raqami">

<input id="car_model" placeholder="Mashina rusumi">

<textarea id="info" placeholder="Qo‘shimcha ma'lumot"></textarea>

<input id="username" placeholder="Login">

<input id="password" type="password" placeholder="Parol">

<button onclick="register()">
    Ro‘yxatdan o‘tish
</button>

<div id="message"></div>

</div>

<script>

async function register() {

    const data = {
        qr_id: document.getElementById("qr_id").value.trim(),
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        car_number: document.getElementById("car_number").value.trim(),
        car_model: document.getElementById("car_model").value.trim(),
        info: document.getElementById("info").value.trim(),
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value
    };

    const message = document.getElementById("message");

    try {

        const response = await fetch("/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            message.innerHTML =
                "❌ " + (result.error || "Xatolik");
            return;
        }

        message.innerHTML =
            "✅ Ro‘yxatdan o‘tish muvaffaqiyatli!";

        setTimeout(() => {
            window.location.href = "/login.html";
        }, 1500);

    } catch (error) {

        message.innerHTML =
            "❌ Server bilan aloqa yo‘q";

    }
}

</script>

</body>
</html>
