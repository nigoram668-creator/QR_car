<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR CAR Registratsiya</title><style>body{font-family:Arial;background:#f2f4f7}.c{max-width:480px;margin:20px auto;background:#fff;padding:25px;border-radius:20px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{background:#2563eb;color:#fff;border:0;font-weight:bold}</style><div class=c><h1>🚗 QR CAR</h1><h3>Registratsiya</h3><form id=f><input id=qr placeholder="QR ID: QRCAR0001" required><input id=n placeholder="Ism-familiya" required><input id=p placeholder="Telefon" required><input id=m placeholder="Avtomobil modeli"><input id=pl placeholder="Davlat raqami"><input id=t placeholder="Telegram"><textarea id=no placeholder="Izoh"></textarea><input id=pa type=password placeholder="Parol (6+ belgi)" required><button>Registratsiya</button></form><p id=x></p></div><script>let z=new URLSearchParams(location.search).get("qr");if(z)qr.value=z;f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({qrId:qr.value,name:n.value,phone:p.value,model:m.value,plate:pl.value,telegram:t.value,note:no.value,password:pa.value})}),d=await r.json();if(!r.ok)return x.textContent="❌ "+d.error;localStorage.token=d.token;location="/account.html"}</script>
