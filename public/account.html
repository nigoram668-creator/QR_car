<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR CAR Profilim</title><style>body{font-family:Arial;background:#f2f4f7}.c{max-width:480px;margin:20px auto;background:#fff;padding:25px;border-radius:20px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{background:#2563eb;color:#fff;border:0;font-weight:bold}</style><div class=c><h1>👤 Profilim</h1><p id=q></p><input id=n placeholder="Ism-familiya"><input id=p placeholder="Telefon"><input id=m placeholder="Avtomobil"><input id=pl placeholder="Davlat raqami"><input id=t placeholder="Telegram"><textarea id=no placeholder="Izoh"></textarea><button onclick=S()>💾 Saqlash</button><button onclick=O()>Chiqish</button><p id=x></p></div><script>let tok=localStorage.token;if(!tok)location="/login.html";async function A(){let r=await fetch("/api/me",{headers:{Authorization:"Bearer "+tok}});if(!r.ok)return location="/login.html";let d=await r.json();q.textContent="QR ID: "+d.qr_id;n.value=d.name;p.value=d.phone;m.value=d.model;pl.value=d.plate;t.value=d.telegram;no.value=d.note}async function S(){let r=await fetch("/api/me",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({name:n.value,phone:p.value,model:m.value,plate:pl.value,telegram:t.value,note:no.value})});x.textContent=r.ok?"✅ Saqlandi":"❌ Xato"}function O(){localStorage.removeItem("token");location="/login.html"}A()</script>
