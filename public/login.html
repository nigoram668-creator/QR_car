<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR CAR Login</title><style>body{font-family:Arial;background:#f2f4f7}.c{max-width:420px;margin:40px auto;background:#fff;padding:25px;border-radius:20px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px}button{background:#2563eb;color:#fff;border:0}</style><div class=c><h1>🔐 QR CAR</h1><input id=q placeholder="QR ID"><input id=p type=password placeholder="Parol"><button onclick=L()>Kirish</button><p id=x></p></div><script>async function L(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({qrId:q.value,password:p.value})}),d=await r.json();if(!r.ok)return x.textContent="❌ "+d.error;localStorage.token=d.token;location="/account.html"}</script>
