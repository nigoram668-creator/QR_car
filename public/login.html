<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Car — Login</title>

<style>
body {
    font-family: Arial;
    background: #f2f4f7;
    padding: 20px;
}

.box {
    max-width: 400px;
    margin: 60px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #ccc;
}

input, button {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    background: #111;
    color: white;
    border: none;
    font-weight: bold;
}

#message {
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>

<div class="box">

<h2>🚗 QR Car</h2>

<input id="username" placeholder="Login">

<input id="password"
       type="password"
       placeholder="Parol">

<button onclick="login()">
    🔐 Kirish
</button>

<div id="message"></div>

</div>

<script>

async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    try {

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const result = await response.json();

        if (!response.ok) {
            message.innerHTML =
                "❌ " + result.error;
            return;
        }

        localStorage.setItem(
            "qr_token",
            result.token
        );

        localStorage.setItem(
            "qr_id",
            result.qr_id
        );

        window.location.href =
            "/dashboard.html";

    } catch (error) {

        message.innerHTML =
            "❌ Server bilan aloqa yo‘q";

    }
}

</script>

</body>
</html>
