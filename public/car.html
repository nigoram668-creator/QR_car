<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Car</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #ccc;
}

h1 {
    text-align: center;
}

.item {
    margin-top: 15px;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 10px;
}

.label {
    color: #777;
    font-size: 13px;
}

.value {
    font-size: 18px;
    font-weight: bold;
    margin-top: 4px;
}

.phone {
    display: block;
    text-align: center;
    background: #111;
    color: white;
    padding: 14px;
    margin-top: 20px;
    border-radius: 10px;
    text-decoration: none;
}

#loading {
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🚗 QR Car</h1>

<div id="loading">
⏳ Ma'lumotlar yuklanmoqda...
</div>

<div id="carInfo" style="display:none;">

<div class="item">
<div class="label">Mashina</div>
<div class="value" id="car_model"></div>
</div>

<div class="item">
<div class="label">Davlat raqami</div>
<div class="value" id="car_number"></div>
</div>

<div class="item">
<div class="label">Egasi</div>
<div class="value" id="name"></div>
</div>

<div class="item">
<div class="label">Qo‘shimcha ma'lumot</div>
<div class="value" id="info"></div>
</div>

<a id="phone"
class="phone">
📞 Egasi bilan bog‘lanish
</a>

</div>

<div id="error"
style="display:none;text-align:center;">
❌ Mashina topilmadi
</div>

</div>

</div>

<script>

async function loadCar() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const qr_id =
        params.get("id");

    if (!qr_id) {

        showError();
        return;
    }

    try {

        /*
        Serverdan mashina ma'lumotlarini
        olamiz
        */

        const response =
            await fetch(
                "/api/car/" + qr_id
            );

        if (!response.ok) {

            showError();
            return;
        }

        const car =
            await response.json();

        document.getElementById(
            "car_model"
        ).textContent =
            car.car_model || "-";

        document.getElementById(
            "car_number"
        ).textContent =
            car.car_number || "-";

        document.getElementById(
            "name"
        ).textContent =
            car.name || "-";

        document.getElementById(
            "info"
        ).textContent =
            car.info || "-";

        if (car.phone) {

            document.getElementById(
                "phone"
            ).href =
                "tel:" + car.phone;

        } else {

            document.getElementById(
                "phone"
            ).style.display =
                "none";
        }

        document.getElementById(
            "loading"
        ).style.display =
            "none";

        document.getElementById(
            "carInfo"
        ).style.display =
            "block";

    } catch (error) {

        showError();

    }

}

function showError() {

    document.getElementById(
        "loading"
    ).style.display =
        "none";

    document.getElementById(
        "error"
    ).style.display =
        "block";

}

loadCar();

</script>

</body>
</html>
